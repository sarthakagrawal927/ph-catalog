[project]
name = "ph-catalog"
version = "0.1.0"
description = "Resumable local Product Hunt catalogue backfill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3.0",
    "httpx[socks]>=0.28.1",
    "lxml>=5.4.0",
    "orjson>=3.10.18",
    "selectolax>=0.3.29",
]

[project.scripts]
ph-catalog = "ph_catalog.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "ph_catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
