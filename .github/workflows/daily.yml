name: Daily Product Hunt refresh

on:
  schedule:
    # 03:17 Asia/Kolkata. The off-hour minute reduces GitHub scheduler delays.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-hunt-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ph-catalog
        run: python -m pip install .

      - name: Restore working database cache
        id: database-cache
        uses: actions/cache/restore@v4
        with:
          path: data/producthunt.duckdb
          key: ph-catalog-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ph-catalog-db-${{ runner.os }}-

      - name: Bootstrap from durable snapshot when cache is empty
        if: steps.database-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshots
          gh release download catalog-state \
            --pattern producthunt-full.parquet \
            --dir snapshots
          ph-catalog restore-snapshot \
            --input snapshots/producthunt-full.parquet

      - name: Refresh manifest and fetch new products
        run: |
          ph-catalog daily \
            --limit 500 \
            --workers 2 \
            --rps 0.25 \
            --snapshot snapshots/producthunt-full.parquet

      - name: Verify catalogue
        run: ph-catalog verify

      - name: Publish durable catalogue snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload catalog-state \
            snapshots/producthunt-full.parquet \
            --clobber

      - name: Save working database cache
        uses: actions/cache/save@v4
        with:
          path: data/producthunt.duckdb
          key: ph-catalog-db-${{ runner.os }}-${{ github.run_id }}
