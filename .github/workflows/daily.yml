name: Daily Product Hunt refresh

on:
  schedule:
    # 03:17 Asia/Kolkata. The off-hour minute reduces GitHub scheduler delays.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-hunt-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Product Hunt denies GitHub-hosted runner IPs at the sitemap boundary.
    # Keep this repository private and run the scheduled job on the registered M1 Mac.
    runs-on: [self-hosted, macOS, ARM64, ph-catalog]
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install ph-catalog
        run: /opt/homebrew/bin/uv sync --frozen --no-dev

      - name: Configure persistent local state
        run: |
          mkdir -p "/Users/assistant/.local/share/ph-catalog"
          echo "PH_DATABASE=/Users/assistant/.local/share/ph-catalog/producthunt.duckdb" >> "$GITHUB_ENV"
          echo "PH_SNAPSHOT=/Users/assistant/.local/share/ph-catalog/producthunt-full.parquet" >> "$GITHUB_ENV"
          echo "PH_COMPACT_ARCHIVE=/Users/assistant/.local/share/ph-catalog/ph-catalog-full.tar.zst" >> "$GITHUB_ENV"

      - name: Bootstrap from durable snapshot when local state is empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$PH_DATABASE" ]]; then
            gh release download catalog-state \
              --pattern producthunt-full.parquet \
              --dir "$RUNNER_TEMP"
            /opt/homebrew/bin/uv run --no-sync ph-catalog \
              --database "$PH_DATABASE" restore-snapshot \
              --input "$RUNNER_TEMP/producthunt-full.parquet"
          fi

      - name: Refresh manifest and fetch new products
        run: |
          /opt/homebrew/bin/uv run --no-sync ph-catalog \
            --database "$PH_DATABASE" daily \
            --limit 500 \
            --workers 2 \
            --rps 0.25 \
            --snapshot "$PH_SNAPSHOT"

      - name: Verify catalogue
        run: |
          /opt/homebrew/bin/uv run --no-sync ph-catalog \
            --database "$PH_DATABASE" verify

      - name: Build compact full-data archive
        run: |
          /opt/homebrew/bin/uv run --no-sync ph-catalog \
            --database "$PH_DATABASE" compact-archive \
            --output "$PH_COMPACT_ARCHIVE" \
            --compression-level 22

      - name: Publish durable catalogue snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload catalog-state \
            "$PH_SNAPSHOT" \
            "$PH_COMPACT_ARCHIVE" \
            --clobber
